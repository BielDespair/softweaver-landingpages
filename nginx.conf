server {
    listen 80;
    listen [::]:80;

    server_name www.softweaver.com.br softweaver.com.br;

    root /usr/share/nginx/html/softweaver;
    index index.html;

    # Respostas do questionário: só aceita gravar .json, não deixa ler
    location ~ ^/questionario/respostas/[0-9A-Za-z-]+\.json$ {
        dav_methods PUT;
        create_full_put_path off;
        client_max_body_size 64k;
        limit_except PUT { deny all; }
    }

    location /questionario/respostas/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}